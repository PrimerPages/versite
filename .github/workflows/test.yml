name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        run: python -m pip install -e . pytest

      - name: Run tests
        run: pytest -q

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Seed test site
        run: |
          mkdir -p _site/guide
          printf '2.0\n' > _site/index.html
          printf 'guide\n' > _site/guide/index.html

      - name: Exercise versite action
        uses: ./
        with:
          version: "2.0"
          aliases: latest
          default-to: latest
          site-dir: _site
          branch: gh-pages
          push: false
          ignore-remote-status: true

      - name: Verify deployment branch contents
        run: |
          git show gh-pages:2.0/index.html | grep '^2.0$'
          git show gh-pages:2.0/guide/index.html | grep '^guide$'
          git show gh-pages:latest/index.html | grep 'http-equiv="refresh"'
          git show gh-pages:index.html | grep 'http-equiv="refresh"'

  success:
    needs:
      - test
      - action-smoke
    runs-on: ubuntu-latest
    steps:
      - name: "Success"
        shell: bash
        run: echo "All checks completed successfully"
